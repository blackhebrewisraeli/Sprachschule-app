name: iOS Simulator Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # build:mobile also syncs every native platform. Keep the web build and
      # iOS sync separate so each CI stage is explicit and runs only once.
      - name: Build web assets for mobile
        run: npm run build
        env:
          VITE_API_BASE_URL: https://www.sprachschule-app.com

      - name: Sync Capacitor iOS project
        run: npx --no -- cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      # Capacitor 8 resolves native dependencies with Swift Package Manager
      # (ios/App/CapApp-SPM), so there is no CocoaPods .xcworkspace: build the
      # .xcodeproj directly. A generic simulator destination needs no installed
      # simulator runtime, and simulator builds need no signing identity.
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          clean build
