name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # don't install git hooks in CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets legacy-peer-deps=true (eslint-plugin-react peer-dep workaround)
      #
      # --ignore-scripts: a dependency's install/postinstall hook is arbitrary
      # code from the registry running with the job's token in its environment.
      # Only two packages in the tree declare one — esbuild and @sentry/cli —
      # and neither needs it here: esbuild 0.21 ships its binary as a platform
      # optionalDependency (@esbuild/<platform>), which npm installs without
      # running anything, and @sentry/cli's binary is only used for source-map
      # upload, which this build does not do. Verified by a clean
      # `npm ci --ignore-scripts` followed by a full build and the whole suite.
      # Our own `prepare: husky` is already a no-op in CI via HUSKY: 0 above.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Its own job, not extra steps in `verify`: lint/test/build feedback must not
  # wait on a browser download, and a contrast regression should read as its own
  # red X rather than hiding inside a generic test failure.
  #
  # No Supabase env on purpose. The audit seeds localStorage itself and never
  # signs in, so auth-unconfigured is a legitimate surface to walk — and adding
  # secrets here would make the job fail on forks.
  contrast-audit:
    name: Contrast · Rendered DOM
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      AUDIT_BASE: http://localhost:5290

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts for the reason spelled out in the verify job above.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # playwright itself is already a devDependency — only the browser binary
      # and its system libs are missing on the runner.
      #
      # `npx --no` runs ONLY the locally installed binary. Bare `npx <name>`
      # silently fetches and executes whatever the registry answers with if the
      # name is missing or misspelled, at whatever version it resolves — the
      # version is pinned by package-lock.json only when the package is already
      # local. --no turns that into a hard failure instead.
      - name: Install Chromium
        run: npx --no -- playwright install --with-deps chromium

      # Stub Supabase config, not real credentials. `isAuthConfigured()` only
      # checks that both values are truthy, so a fake host is enough to make the
      # build render the account chrome — the AccountChip, the Stats account
      # section, the league table and the profile card — which the audit then
      # reaches with a seeded session and stubbed responses. Without this the
      # signed-in half of the audit has nothing to look at, which is how those
      # surfaces went unaudited for as long as they did. Nothing here is secret
      # and nothing reaches the network: the audit intercepts every call.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://stub.supabase.co
          VITE_SUPABASE_ANON_KEY: stub-anon-key-not-a-secret
          VITE_LEAGUES_ENABLED: 'true'

      # Serve, wait, and audit in one step so the backgrounded server is
      # guaranteed to outlive the shell that started it. The production build is
      # what users get, so it is what gets audited — not the dev server.
      - name: Audit contrast against the production build
        run: |
          npx --no -- vite preview --port 5290 --strictPort &
          # Poll rather than sleep — a fixed sleep is how this job becomes flaky.
          for i in $(seq 1 60); do
            if curl -sf "$AUDIT_BASE" > /dev/null; then
              echo "preview server up after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "preview server never answered on $AUDIT_BASE"
              exit 1
            fi
            sleep 1
          done
          npm run audit:contrast
        env:
          # Must match the build above: the script derives the supabase-js
          # session storage key (`sb-<ref>-auth-token`) from this host.
          VITE_SUPABASE_URL: https://stub.supabase.co

  # Its own job for the same reason contrast is: lint/test/build must not wait
  # on a browser download, and a learning-path regression should read as its
  # own red X. Guest-only — no Supabase env, no AI — matching the path a new
  # learner takes from Home without an account.
  learning-path-smoke:
    name: Learning path · Browser
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      AUDIT_BASE: http://localhost:5290

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx --no -- playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Smoke recommendation → practice → finish → refresh
        run: |
          npx --no -- vite preview --port 5290 --strictPort &
          for i in $(seq 1 60); do
            if curl -sf "$AUDIT_BASE" > /dev/null; then
              echo "preview server up after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "preview server never answered on $AUDIT_BASE"
              exit 1
            fi
            sleep 1
          done
          npm run smoke:learning-path

  # The signed-in half of the same journey: sync wire, reconcile-after-wipe,
  # leagues, account controls, sign-out. Its own job for the same reasons as
  # the guest smoke above, and a SEPARATE job rather than another step in it
  # because the two need incompatible builds — guest runs against a build with
  # no Supabase env, this one needs stub Supabase config or the seeded session
  # is rejected.
  #
  # It went red one day after it shipped (#311 gave the Settings segmented
  # control a second `aria-label="Account"`) and nothing noticed, because it
  # existed only as an npm script. That is what this job is for.
  #
  # Deliberately NO `AUDIT_BASE` and no build step: unset means the script
  # provisions its own target, and it is the script — not this file — that
  # knows the build needs `VITE_SUPABASE_URL`/`ANON_KEY` stubs plus leagues
  # and sync on. Building here instead would put that env in two places and
  # let them drift; the header of the script explains the failure mode.
  auth-learning-path-smoke:
    name: Learning path · Signed in
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx --no -- playwright install --with-deps chromium

      - name: Smoke restore → sync → reload → leagues → sign out
        run: npm run smoke:auth-learning-path

      # The run writes smoke-auth-failure-<name>-<width>.png for the viewport
      # that failed. On a red run that screenshot is the fastest read there is,
      # and without this it dies with the runner.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-smoke-failure-screenshots
          path: smoke-auth-failure-*.png
          if-no-files-found: ignore
          retention-days: 7

  rls-policy-tests:
    name: RLS Policy Tests
    runs-on: ubuntu-latest
    # A job-level block REPLACES the defaults: every scope not listed becomes
    # `none`. So contents:read has to be stated alongside packages:read, or
    # actions/checkout below loses its token's read access.
    permissions:
      contents: read
      packages: read
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts for the reason spelled out in the verify job above.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Pinned, not `latest`. Resolving `latest` makes setup-cli call the
      # unauthenticated GitHub releases API on every run, which fails the whole
      # job with "Failed to resolve latest Supabase CLI release: rate limit
      # exceeded" — it did exactly that on PR #117, 21s in, with the RLS suite
      # never executing. A pinned version skips the lookup entirely, and a red
      # RLS job then means a real policy regression rather than GitHub's quota.
      # Bump deliberately when a migration needs a newer CLI.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Authenticates any pull that lands on ghcr.io. The CLI reads Docker's
      # config file for registry credentials, so this login does reach it.
      # On its own it did NOT stop the `toomanyrequests` on #333 — the pulls
      # were authenticated and still throttled — which is why the start step
      # below also lets the CLI fall back to other registries. GITHUB_TOKEN via
      # env + --password-stdin keeps it out of argv and logs.
      - name: Log in to GHCR
        run: |
          printf '%s' "$GITHUB_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # setup-cli exports SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io for every
      # CLI >= 1.28 (no input turns it off). With that override set, the CLI
      # pulls from ghcr.io ONLY. Unset, it tries public.ecr.aws, then ghcr.io,
      # then Docker Hub (GetRegistryImageUrls in the CLI's docker.go). On #333
      # GHCR throttled every pull even after the login above succeeded, so the
      # fallback chain is what actually keeps a registry outage from failing
      # the RLS suite. The login still authenticates the ghcr.io tier.
      - name: Start local Supabase (applies migrations)
        run: |
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          supabase start

      - name: Run RLS adversarial suite
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${SUPABASE_URL:-$API_URL}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-$ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$SERVICE_ROLE_KEY}"
          npm run test:rls

  # SonarCloud, CI-based rather than Automatic Analysis — the only way a coverage
  # report reaches the dashboard. See sonar-project.properties for the scope.
  #
  # Its own job, and deliberately NOT one of the required checks. `SonarCloud
  # Code Analysis` (posted by the SonarCloud app, from whichever analysis it
  # receives) stays the required one; this job only feeds it. That separation is
  # what makes the rollout safe: while SONAR_TOKEN is unset every step below is
  # skipped, so merging this changes nothing, and if the scan later fails — a
  # wrong org, or the window where Automatic Analysis is still enabled and
  # SonarCloud refuses a CI analysis — it goes red on its own without blocking
  # any pull request.
  #
  # Order matters when enabling: add SONAR_TOKEN FIRST, then turn Automatic
  # Analysis off. Doing it the other way leaves no analysis at all, and a
  # required check that never appears blocks every PR indefinitely.
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Presence, never the value — `[ -z ]` tests without printing. Echoing a
      # secret to check it is how one gets leaked into a public log.
      - name: Is SonarCloud configured?
        id: guard
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN is not set — skipping. Add the secret to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # fetch-depth: 0 — Sonar attributes issues to commits via git blame to
      # decide what is "new code". A shallow clone makes every line look new.
      - name: Checkout
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: npm ci --ignore-scripts

      # Produces coverage/lcov.info, which sonar-project.properties points at.
      - name: Coverage
        if: steps.guard.outputs.configured == 'true'
        run: npm run test:coverage

      # Pinned to a full commit SHA, not a tag. A tag is mutable — whoever
      # controls the action's repo can repoint it at new code that then runs
      # here with SONAR_TOKEN in scope. Sonar raises this as a Major issue
      # ("Use full commit SHA hash for this dependency"), and it did exactly
      # that to this line when it was written as @v4: the very first push of
      # this PR failed on C Security Rating for one unpinned third-party
      # action. GitHub-owned actions/* above are not flagged.
      #
      # 2291811 is the v8.2.1 release (2026-07-13). @v4, the version this was
      # first written against, resolved to a commit from 2025-09-25. Bump
      # deliberately: read the diff, then move both the SHA and the comment.
      - name: SonarCloud scan
        if: steps.guard.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
