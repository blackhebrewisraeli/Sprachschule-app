# Does production have every migration this repo has committed?
#
# Exists because of the E4 outage (2026-09-04): #237 merged carrying
# 20260904140000_progress_events_seen.sql and nobody applied it. That file
# changes apply_progress_event's ARITY, so the deployed endpoint called an
# 8-arg RPC against a 7-arg database. Every POST /api/v1/progress/events failed
# for ~26 hours, and because E4 had already removed the competing daily upsert
# from sync there was no fallback writer. Server-side progress simply stopped.
#
# Nothing was red. CI only ever sees the LOCAL stack: the RLS job runs
# `supabase start`, which applies every migration in the repo, so the local
# database is always perfectly in sync and the drift is invisible by
# construction. A merged migration file is not an applied migration.
#
# Deliberately NOT one of the four required checks. It reports on the state of
# production, which no pull request can fix, so it must never block a merge.
#
# Note that GitHub disables scheduled workflows after 60 days with no repo
# activity — the same caveat uptime.yml carries.

name: Migration Drift

on:
  schedule:
    - cron: '17 7 * * *' # daily, off the hour to miss the scheduler stampede
  workflow_dispatch: # after applying one, to confirm and go green
  push:
    branches: [main]
    paths:
      # The moment the gap opens. Expect this to be RED between merging a
      # migration and applying it — that is the signal, not a false alarm.
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  drift:
    name: Repo vs Production Migrations
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No `cache: npm` and no `npm ci`: the checker imports only node
          # builtins, so installing the dependency tree would be the slowest
          # part of a job that otherwise runs in seconds.

      - name: Compare repo migrations against the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set on this repo, so migration drift is UNVERIFIED."
            echo "Create a SCOPED personal access token (Supabase → Account → Access Tokens)"
            echo "with database read on project xcnnlczvxmuwcqwychox, and add it as a repository"
            echo "secret named SUPABASE_ACCESS_TOKEN. A classic token would carry your whole"
            echo "account — every organisation and project, including future ones."
            exit 1
          fi
          node scripts/check-migrations/index.js
