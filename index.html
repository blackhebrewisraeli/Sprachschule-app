<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for browsers that ignore an SVG favicon. The file has
         existed in public/ since the first icon pass and was never linked, so
         those browsers fell through to a /favicon.ico that does not exist. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- One apple-touch-icon, and it is the 180. iOS applies its own squircle,
         so the artwork is a full-bleed square; the 192 line that used to sit
         here pointed at the PWA bitmap, which bakes its own rounded plane and
         would have been rounded a second time. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color is light-mode `fg` (#16110b): the sticky masthead is
         accent-black and does not invert. background_color in the generated
         manifest is light `ground` (#FBF8F1) — see vite.config.js. -->
    <meta name="theme-color" content="#16110b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="sprachschule-app" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="sprachschule-app — a bold German learning app powered by Claude"
    />
    <title>sprachschule-app</title>

    <!--
      Sharing metadata. The app's only distribution during beta is somebody
      pasting the link, and without this a paste renders as a bare URL.

      The origin is written out in full because crawlers do not resolve a
      relative og:image — a root-relative path is silently dropped, which looks
      identical to having no card at all. It is duplicated from AGENTS.md
      ("Linked environments"), and src/brandAssets.test.js asserts every
      absolute URL here against that one constant so the copies cannot drift.

      og:image is public/social-preview.png, rendered by `npm run gen:assets`.
      The declared width/height are checked against the PNG's own IHDR header
      by the same test: a stale pair makes crawlers reserve the wrong box.
    -->
    <link rel="canonical" href="https://deutsch-app-dusky.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sprachschule-app" />
    <meta property="og:title" content="sprachschule-app" />
    <meta
      property="og:description"
      content="An AI tutor for German — guided chat, spaced-repetition vocabulary and translation drills."
    />
    <meta property="og:url" content="https://deutsch-app-dusky.vercel.app/" />
    <meta property="og:image" content="https://deutsch-app-dusky.vercel.app/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Deutsch. wordmark beside a vocabulary card reading Hallo, with four answer tiles and Hello marked correct."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="sprachschule-app" />
    <meta
      name="twitter:description"
      content="An AI tutor for German — guided chat, spaced-repetition vocabulary and translation drills."
    />
    <meta name="twitter:image" content="https://deutsch-app-dusky.vercel.app/social-preview.png" />
    <meta
      name="twitter:image:alt"
      content="The Deutsch. wordmark beside a vocabulary card reading Hallo, with four answer tiles and Hello marked correct."
    />

    <!--
      Pre-JS shell. The app is client-rendered into an empty #root, so until the
      entry chunk had downloaded, parsed and mounted, the screen was blank: a
      phone on 4g measured FCP 2856ms cold against 144ms warm, with first paint
      and largest paint landing on the same event — nothing had rendered at all.

      This paints the wordmark with zero JavaScript and no network beyond the
      HTML itself, so something correct appears immediately and React swaps it
      out on mount. It moves *perceived* start-up only; the entry chunk still
      has to arrive before the app is interactive.

      The colours are duplicated from src/lib/themeTokens.js because CSS cannot
      import them. src/shellTheme.test.js fails if the two ever drift apart.
    -->
    <style>
      :root {
        --shell-bg: #fbf8f1;
        --shell-fg: #16110b;
        --shell-dot: #c41e1e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shell-bg: #0f0f11;
          --shell-fg: #edebe8;
          --shell-dot: #ff6b6b;
        }
      }
      html {
        background: var(--shell-bg);
      }
      body {
        margin: 0;
      }
      #shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--shell-bg);
        color: var(--shell-fg);
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 900;
        font-size: clamp(40px, 12vw, 72px);
        letter-spacing: -0.04em;
        line-height: 1;
        /* Never intercept a tap. It is removed the frame after mount anyway,
           but a full-screen overlay that could swallow input is not worth the
           risk if that ever fails. */
        pointer-events: none;
      }
      #shell span {
        color: var(--shell-dot);
      }
    </style>
    <script>
      // Resolve the stored theme before first paint so the shell cannot flash
      // the wrong ground. Mirrors themeMode.js; kept tiny and dependency-free
      // because it runs ahead of every other byte of script.
      (function () {
        try {
          var mode = localStorage.getItem('deutsch-theme-mode');
          if (mode !== 'light' && mode !== 'dark') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var g = {
            light: ['#fbf8f1', '#16110b', '#c41e1e'],
            dark: ['#0f0f11', '#edebe8', '#ff6b6b'],
          }[mode];
          if (g) {
            var s = document.documentElement.style;
            s.setProperty('--shell-bg', g[0]);
            s.setProperty('--shell-fg', g[1]);
            s.setProperty('--shell-dot', g[2]);
          }
        } catch (e) {
          /* private mode or storage disabled — the CSS defaults already apply */
        }
      })();
    </script>
  </head>
  <body>
    <div id="shell" aria-hidden="true">Deutsch<span>.</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
