<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to sprachschule-app</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 32px 24px;
      font-family: Georgia, 'Times New Roman', serif;
      color: #1a1a1a;
      background: #f7f4ef;
    "
  >
    <div style="max-width: 420px; margin: 0 auto">
      <p
        style="
          font-family: 'Courier New', Courier, monospace;
          font-size: 12px;
          letter-spacing: 0.12em;
          color: #6b6560;
          margin: 0 0 8px;
        "
      >
        sprachschule-app
      </p>
      <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 24px; line-height: 1.2">
        Your sign-in code
      </h1>
      <p style="font-size: 16px; line-height: 1.5; margin: 0 0 16px">
        Enter this 6-digit code in the app:
      </p>
      <p
        style="
          font-family: 'Courier New', Courier, monospace;
          font-size: 36px;
          letter-spacing: 0.28em;
          font-weight: 700;
          margin: 0 0 28px;
        "
      >
        {{ .Token }}
      </p>
      <p style="font-size: 16px; line-height: 1.5; margin: 0 0 12px">
        Or
        <a href="{{ .ConfirmationURL }}" style="color: #b33a2b">tap this link</a>
        to sign in on this device.
      </p>
      <p
        style="
          font-family: 'Courier New', Courier, monospace;
          font-size: 12px;
          color: #6b6560;
          line-height: 1.5;
          margin: 28px 0 0;
        "
      >
        This code expires in five minutes. If you didn’t request it, you can ignore this email.
      </p>
    </div>
  </body>
</html>
