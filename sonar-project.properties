# SonarCloud, CI-based analysis.
#
# This file exists because Automatic Analysis cannot ingest a coverage report.
# The dashboard reported "0.0% Coverage on New Code" for a repo with ~1760
# tests — a MISSING number, not a low one — and a coverage condition added to
# the quality gate would have failed instantly and inexplicably. The scanner
# runs in .github/workflows/ci.yml and reads coverage/lcov.info.
#
# Automatic Analysis MUST be turned off in the SonarCloud project settings for
# this to run; SonarCloud refuses a CI analysis while it is enabled.

sonar.projectKey=blackhebrewisraeli_deutsch-app
sonar.organization=blackhebrewisraeli

# ── What is production code ─────────────────────────────────────────────────
# Narrower than Automatic Analysis, which had no configuration and so analysed
# the whole tree. Everything dropped here (scripts/, supabase/, config) is
# tooling rather than shipped code; narrowing can only remove issues, never add
# them, so it cannot regress the ratings that were just brought to A.
sonar.sources=src,api

# Tests are analysed as TESTS, not as production code. Without sonar.tests they
# count as main source, which is how a ReDoS-prone regex in a *.test.js and an
# exact float comparison in another became main-code findings. Test code is
# still linted by Sonar, under the rules meant for it.
sonar.tests=src,api,scripts
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

# test-setup.js is harness, not a test and not shipped code.
sonar.exclusions=src/test-setup.js

# ── Coverage ────────────────────────────────────────────────────────────────
# Paths inside lcov.info are repo-relative (SF:api/chat.js), which is what
# Sonar resolves against sonar.projectBaseDir. Regenerate with:
#   npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The lexicon is generated content, not authored source: ~2.7 MB of JSON across
# public/lexicon/de/. It is not under sonar.sources, but naming it here keeps it
# out of the duplication metric too — duplication is a RATIO, and this repo has
# already had that condition fire at 25.3% on a small PR.
#
# The Translate sentence banks are the same case in .js form: authored content
# rows ({ en, de, words, blank, distractors, note }), no logic. SonarJS
# normalises literals before comparing tokens, so every row is a "copy" of the
# row next to it, and any content edit — #362 gave 30 rows a `blank` — counts
# as duplicated new code (3.9% there, none of it in code). Other
# pure-data pack banks can join this list for the same reason; a pack file
# with logic in it must not.
#
# The legal pages are the same case again: SECTIONS is owner-supplied copy,
# reproduced verbatim as `{ term, text }` rows with no logic. A run of N such
# rows is N-1 "copies" of itself once literals fold, so adding one approved
# paragraph to a list (#411: one Privacy Policy item) reads as 30.8% duplicated
# new code in that file and fails the 3% gate, none of it in code. The copy is
# not ours to reshape to dodge a metric (see PrivacyPolicy.jsx). Reproduced
# locally with a literal-folding token-window detector: 4 of 13 new lines, as
# Sonar reported. Only the files that are pure copy tables belong here.
sonar.cpd.exclusions=public/lexicon/**,src/packs/*/translate.js,src/components/legal/PrivacyPolicy.jsx,src/components/legal/TermsOfService.jsx,src/components/legal/DeleteAccountPage.jsx
